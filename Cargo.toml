[workspace]
resolver = "2"
members = ["crates/paint-core", "crates/paint-cli", "crates/paint-formats", "crates/paint-brush", "crates/paint-studio", "crates/paint-plugin", "crates/paint-3d", "crates/pen-test", "crates/paint-app", "crates/virtual-tablet"]

[workspace.package]
edition = "2021"
version = "1.4.0"
license = "MIT"

[profile.dev]
opt-level = 1

# Правила сверх обычного clippy (выбраны из BeautifulRust): ship.sh гоняет clippy с -D warnings.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"      # у каждого unsafe — комментарий SAFETY: почему это безопасно
allow_attributes_without_reason = "warn" # у каждого #[allow] — reason = "…"
redundant_clone = "warn"                 # лишнее копирование
dbg_macro = "warn"
todo = "warn"
