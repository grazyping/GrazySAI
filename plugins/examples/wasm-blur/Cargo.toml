# Пример плагина-фильтра на WebAssembly (Rust). Сборка:
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
#   cp target/wasm32-unknown-unknown/release/gs_blur.wasm filter.wasm
[package]
name = "gs-blur"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

# свой проект, не часть рабочей области GrazySAI
[workspace]
