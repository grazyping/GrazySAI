[package]
name = "paint-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "GrazySAI"
path = "src/main.rs"

[dependencies]
paint-core = { path = "../paint-core" }
paint-formats = { path = "../paint-formats" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
rusqlite = { version = "0.32", features = ["bundled"] }
paint-brush = { path = "../paint-brush" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }
