[package]
name = "paint-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "GrazySAI"
path = "src/main.rs"

[dependencies]
paint-core = { path = "../paint-core" }
paint-formats = { path = "../paint-formats" }
paint-3d = { path = "../paint-3d" }
glam = "0.34"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
rusqlite = { version = "0.32", features = ["bundled"] }
paint-brush = { path = "../paint-brush" }
paint-plugin = { path = "../paint-plugin" }
egui-phosphor = "0.7.3"
egui_dock = { version = "0.14.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }

[lints]
workspace = true
