[package]
name = "paint-3d"
description = "Слой 3D GrazySAI: загрузка glTF/GLB и OBJ, позы, камера, отрисовка на процессоре"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
paint-core = { path = "../paint-core" }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "KHR_texture_transform", "KHR_materials_unlit"] }
tobj = { version = "4.0", default-features = false }
glam = "0.34"
serde_json = "1"
