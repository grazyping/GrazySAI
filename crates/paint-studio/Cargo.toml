[package]
name = "paint-studio"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "GrazySAI-Studio"
path = "src/main.rs"

[dependencies]
paint-core = { path = "../paint-core" }
paint-formats = { path = "../paint-formats" }
paint-brush = { path = "../paint-brush" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
